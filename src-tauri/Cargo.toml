[package]
name = "shardreader"
version = "0.1.0"
description = "A local-first EPUB reader"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "shardreader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.20"
uuid = { version = "1", features = ["v4"] }
# EPUB uses only DEFLATE — disable every other codec zip brings in
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.dev]
incremental = true
debug = 0
codegen-units = 256

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
